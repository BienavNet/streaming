spring:
  application:
    name: streaming

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/streaming}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:admin}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}

springdoc:
  swagger-ui:
    path: /docs
    operations-sorter: alpha
